<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteDex - Main Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Settings Menu -->
    <div class="settings-menu" id="settingsMenu">
        <div class="menu-header">
            <h3>Settings</h3>
            <span class="menu-close" onclick="toggleMenu()">✕</span>
        </div>
        <ul class="menu-list">
            <li><a href="#settings" onclick="handleMenuClick('settings')">⚙️ Settings</a></li>
            <li><a href="#profile" onclick="handleMenuClick('profile')">👤 Profile</a></li>
            <li><a href="#about" onclick="handleMenuClick('about')">ℹ️ About</a></li>
            <li><a href="#help" onclick="handleMenuClick('help')">❓ Help</a></li>
            <li class="divider"></li>
            <li><a href="#logout" onclick="handleMenuClick('logout')" class="logout">🚪 Logout</a></li>
        </ul>
    </div>

    <div class="container">
        <!-- Settings Gear Icon -->
        <div class="settings-icon" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24M19.78 19.78l-4.24-4.24m-5.08-5.08l-4.24-4.24"></path>
            </svg>
        </div>

        <!-- Main Menu Content -->
        <div class="content">
            <h1 class="title">Main Menu</h1>
            <p class="subtitle">Choose Your Adventure</p>
            
            <div class="menu-buttons">
                <button class="menu-btn menu-btn-primary" onclick="startGame()">
                    <span class="btn-icon">🎮</span>
                    <span>Start New Game</span>
                </button>
                <button class="menu-btn menu-btn-secondary" onclick="continueGame()">
                    <span class="btn-icon">▶️</span>
                    <span>Continue Game</span>
                </button>
                <button class="menu-btn menu-btn-secondary" onclick="goToSettings()">
                    <span class="btn-icon">⚙️</span>
                    <span>Game Settings</span>
                </button>
                <button class="menu-btn menu-btn-exit" onclick="goHome()">
                    <span class="btn-icon">🏠</span>
                    <span>Back to Home</span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
