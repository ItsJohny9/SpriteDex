<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteDex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Settings Menu (Moved Outside Container) -->
    <div class="settings-menu" id="settingsMenu">
        <div class="menu-header">
            <h3>Settings</h3>
            <span class="menu-close" onclick="toggleMenu()">✕</span>
        </div>
        <ul class="menu-list">
            <li><a href="#settings" onclick="handleMenuClick('settings')">⚙️ Settings</a></li>
            <li><a href="#profile" onclick="handleMenuClick('profile')">👤 Profile</a></li>
            <li><a href="#about" onclick="handleMenuClick('about')">ℹ️ About</a></li>
            <li><a href="#help" onclick="handleMenuClick('help')">❓ Help</a></li>
            <li class="divider"></li>
            <li><a href="#logout" onclick="handleMenuClick('logout')" class="logout">🚪 Logout</a></li>
        </ul>
    </div>

    <!-- Sign Up Modal -->
    <div class="modal" id="signupModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeSignUp()">✕</span>
            <h2>Sign Up!</h2>
            <form id="signupForm">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Enter your password">
                </div>
                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" required placeholder="Confirm your password">
                </div>
                <button type="submit" class="form-btn">Create Account</button>
            </form>
            <p class="form-footer">Already have an account? <a href="#" onclick="switchToLogin()">Log In</a></p>
        </div>
    </div>

    <!-- Log In Modal -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeLogin()">✕</span>
            <h2>Log In</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="form-btn">Log In</button>
            </form>
            <p class="form-footer">Don't have an account? <a href="#" onclick="switchToSignUp()">Sign Up</a></p>
        </div>
    </div>

    <div class="container">
        <!-- Settings Gear Icon -->
        <div class="settings-icon" onclick="toggleMenu()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24M19.78 19.78l-4.24-4.24m-5.08-5.08l-4.24-4.24"></path>
            </svg>
        </div>

        <!-- Auth Buttons (Top Left) -->
        <div class="auth-buttons">
            <button class="auth-btn auth-signup" onclick="openSignUp()">Sign Up!</button>
            <button class="auth-btn auth-login" onclick="openLogin()">Log In</button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="title">SpriteDex</h1>
            <p class="subtitle">Discover. Collect. Master.</p>
            
            <div class="button-group">
                <button class="btn btn-primary">Play</button>
                <button class="btn btn-secondary">Collection</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
