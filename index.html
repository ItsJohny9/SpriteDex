<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpriteDex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Settings Gear Icon -->
        <div class="settings-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m5.08-5.08l4.24-4.24M19.78 19.78l-4.24-4.24m-5.08-5.08l-4.24-4.24"></path>
            </svg>
        </div>

        <!-- Auth Buttons (Top Right) -->
        <div class="auth-buttons">
            <button class="auth-btn auth-signup">Sign Up!</button>
            <button class="auth-btn auth-login">Log In</button>
        </div>

        <!-- Main Content -->
        <div class="content">
            <h1 class="title">SpriteDex</h1>
            <p class="subtitle">Discover. Collect. Master.</p>
            
            <div class="button-group">
                <button class="btn btn-primary">Play</button>
                <button class="btn btn-secondary">Collection</button>
            </div>
        </div>
    </div>
</body>
</html>
